services:
  - type: web
    name: codeguard-ai-backend
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: GROQ_API_KEY
        scope: project
      - key: GITHUB_TOKEN
        scope: project
      - key: GITHUB_WEBHOOK_SECRET
        scope: project
      - key: GEMINI_API_KEY
        scope: project
      - key: CORS_ORIGINS
        value: "*"
